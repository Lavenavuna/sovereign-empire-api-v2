<!DOCTYPE html>
<html>
<head>
    <title>Sovereign Empire AI Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0c29;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            flex-direction: column;
            gap: 40px;
        }

        .logo-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px 70px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
            display: inline-block;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .symbol {
            width: 90px;
            height: 90px;
            background: rgba(255,255,255,0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            border: 2px solid rgba(255,255,255,0.25);
            flex-shrink: 0;
        }

        .text {
            color: #fff;
        }

        .text h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 3px;
            margin: 0;
            text-shadow: 0 2px 20px rgba(0,0,0,0.2);
        }

        .text .sub {
            font-size: 16px;
            opacity: 0.75;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .text .tagline {
            font-size: 13px;
            opacity: 0.5;
            margin-top: 6px;
            letter-spacing: 2px;
        }

        .download-btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 14px 40px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .download-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .instructions {
            color: #888;
            font-size: 14px;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
        }

        .instructions code {
            background: rgba(255,255,255,0.08);
            padding: 2px 10px;
            border-radius: 4px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="logo-container" id="logoContainer">
        <div class="logo">
            <div class="symbol">⚡</div>
            <div class="text">
                <h1>SOVEREIGN EMPIRE</h1>
                <div class="sub">AI PLATFORM</div>
                <div class="tagline">✦ Autonomous Agents · 24/7 Automation ✦</div>
            </div>
        </div>
    </div>

    <button class="download-btn" onclick="downloadPNG()">📥 Download as PNG</button>

    <div class="instructions">
        <p>Click the button above to download your logo as a <strong>transparent PNG</strong>.</p>
        <p>Upload this to <strong>Bloom AI</strong> for your brand assets.</p>
        <p style="margin-top: 8px; font-size: 12px; color: #666;">
            💡 For best results, use this logo for your brand profile.
        </p>
    </div>

    <script>
        function downloadPNG() {
            const container = document.getElementById('logoContainer');
            
            // Use html2canvas to capture the logo
            // Load the library dynamically
            const script = document.createElement('script');
            script.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
            script.onload = function() {
                html2canvas(container, {
                    backgroundColor: null, // Transparent background
                    scale: 3, // High resolution
                    useCORS: true,
                    logging: false,
                    width: container.scrollWidth,
                    height: container.scrollHeight
                }).then(function(canvas) {
                    // Create download link
                    const link = document.createElement('a');
                    link.download = 'Sovereign_Empire_AI_Logo.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(function(err) {
                    alert('Error generating image. Please try again or take a screenshot.');
                    console.error(err);
                });
            };
            document.head.appendChild(script);
            
            // If script already loaded, use it directly
            if (typeof html2canvas !== 'undefined') {
                html2canvas(container, {
                    backgroundColor: null,
                    scale: 3,
                    useCORS: true,
                    logging: false
                }).then(function(canvas) {
                    const link = document.createElement('a');
                    link.download = 'Sovereign_Empire_AI_Logo.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            }
        }
    </script>

</body>
</html>
