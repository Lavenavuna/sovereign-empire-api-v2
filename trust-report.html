<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Report — Sovereign Empire</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B1220; --slate:#64748B; --blue:#185FA5; --teal:#1D9E75; --amber:#E8A23D; --paper:#F6F8FA; --line:#E2E8F0; }
  *{box-sizing:border-box;} body{margin:0; font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink); padding:32px 20px 60px;}
  .wrap{max-width:820px; margin:0 auto;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:1.7rem; margin-bottom:4px;}
  .sub{color:var(--slate); font-size:0.85rem; margin-bottom:24px; font-family:'JetBrains Mono',monospace;}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:16px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px;}
  .stat{}
  .stat .num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.7rem;}
  .stat .lbl{font-size:0.78rem; color:var(--slate);}
  .ok{background:#F0FAF6; border:1px solid var(--teal); border-radius:10px; padding:14px 18px; font-size:0.9rem; color:#0B1220; margin-top:6px;}
  .warn{background:#FFF8ED; border:1px solid var(--amber); border-radius:10px; padding:14px 18px; font-size:0.85rem; margin-top:10px; color:#7A4A0A;}
  .row{display:flex; justify-content:space-between; padding:8px 0; border-top:1px dashed var(--line); font-size:0.85rem;}
  #loading{color:var(--slate); font-family:'JetBrains Mono',monospace; font-size:0.85rem;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Trust Report</h1>
  <div class="sub">Generated live from the audit trail — not a mockup</div>
  <div id="loading">Loading audit data…</div>
  <div id="content" style="display:none;"></div>
</div>
<script>
fetch('/api/trust-report').then(r => r.json()).then(data => {
  document.getElementById('loading').style.display = 'none';
  const c = document.getElementById('content');
  c.style.display = 'block';
  const s = data.summary;
  c.innerHTML = `
    <div class="card">
      <div class="grid">
        <div class="stat"><div class="num">${s.totalActions}</div><div class="lbl">Total actions</div></div>
        <div class="stat"><div class="num">${s.executed}</div><div class="lbl">Executed (T0/T1)</div></div>
        <div class="stat"><div class="num">${s.escalated}</div><div class="lbl">Escalated (T2)</div></div>
        <div class="stat"><div class="num">${s.approved}</div><div class="lbl">Approved</div></div>
        <div class="stat"><div class="num">${s.rejected}</div><div class="lbl">Rejected</div></div>
        <div class="stat"><div class="num">${s.pendingNow}</div><div class="lbl">Pending now</div></div>
      </div>
      <div class="ok">✓ ${data.integrityStatement}</div>
    </div>
    <div class="card">
      <strong>Research grounding</strong>
      <div class="row"><span>RAG cycles run</span><span>${data.research.ragCyclesRun}</span></div>
      <div class="row"><span>Grounded cycles</span><span>${data.research.groundedCycles}</span></div>
      <div class="row"><span>Ungrounded cycles</span><span>${data.research.ungroundedCycles}</span></div>
      ${data.research.note ? `<div class="warn">⚠ ${data.research.note}</div>` : ''}
    </div>
    <div class="card">
      <strong>Report window</strong>
      <div class="row"><span>Generated</span><span>${new Date(data.generatedAt).toLocaleString()}</span></div>
      <div class="row"><span>Window</span><span>${data.windowHours} hours</span></div>
    </div>
  `;
}).catch(e => {
  document.getElementById('loading').textContent = 'Could not load report: ' + e.message;
});
</script>
</body>
</html>
